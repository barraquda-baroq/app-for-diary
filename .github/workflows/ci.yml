name: CI

# 型の確かめ・単体テスト・同期のテスト（Firebase エミュレーター）・ビルド・E2E（docs/SPEC.md の 2.10・21.）。NS の .github/workflows/ci.yml から、
# iPhone・Android のアプリ（android・ios の仕事）・GitHub Pages の公開・Claude 用のコネクタの部分を外した物。
# 2つのブラウザでの同期の E2E（NS の test:e2e:sync）は、画面ができる段階で足す。
on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: 整形の確かめ（Prettier）
        run: npm run format:check
      # E2E のテストには流す端末の印（@pc・@s・@m・@ios。playwright.config.ts）を付ける。印の無いテストはどの端末でも流れないので
      # ここで止める（e2e/check-tags.mjs。テストを並べるだけで、ブラウザも開発サーバーも使わない。docs/SPEC.md の 2.10）
      - name: E2E のテストの端末の印の確かめ
        run: npm run e2e:tags
      # src/ の単体テストと、scripts/ のテスト（vite.config.ts の埋め込み・manifest・アイコン・書体のライセンス、公開の前の確かめ）
      - name: 単体テスト
        run: npm test
      # Firebase エミュレーター（firebase-tools 15）は Java 21 以上が要る（ランナーの既定は 17）。NS の ci.yml と同じ形
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Firebase エミュレーターのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      # 端末2台の同期・月の束・受け取り箱・持ち主とアクセスルール（src/sync/sync.emu.test.ts）と、段階0でログインしたままの端末が
      # 段階1の版に上がった時の持ち主の確かめ（src/sync/upgrade.emu.test.ts）。段階1
      - name: 同期のテスト（Firebase エミュレーター）
        run: npm run test:sync
      - name: ビルド
        run: npm run build
      # 公開するビルドに、テスト用の入口（ログインの印・開発用フック window.__ds・エミュレーターのプロジェクト名）が残っていない
      # （docs/SPEC.md の 2.10。ビルドした物で印を置いても効かないことは e2e/offline.spec.ts でも確かめる）
      - name: ビルドにテスト用の入口が無いことの確かめ
        run: "! grep -rqE 'diary-studio:test-auth|fakeSignIn|showUpdateBanner|__ds|demo-diary-studio' dist/"
      # ふだんは1分半ほど。GitHub の機械が Ubuntu の置き場（archive.ubuntu.com）の名前を引けない時、apt が1つずつ待ち続けて
      # 30分の期限まで止まったことがある（2026-11-11）。1回を8分で打ち切り、1分おいてもう1回だけやり直す。
      # 打ち切っても、sudo の下の apt-get は残って dpkg の鍵を持ち続ける（2回目が「Could not get lock」で落ちた）ので、
      # やり直す前に残った apt-get を止め、鍵が空くのを待つ
      - name: E2E テスト用ブラウザ
        id: browsers
        timeout-minutes: 18
        run: |
          for attempt in 1 2; do
            if timeout 480 npx playwright install --with-deps chromium webkit; then exit 0; fi
            echo "ブラウザを入れられなかった（${attempt}回目）"
            [ "$attempt" = 2 ] && break
            sudo pkill -x apt-get || true
            for i in $(seq 30); do pgrep -x apt-get > /dev/null || break; sleep 2; done
            sleep 60
          done
          exit 1
      # PC 1400×900・Pixel 7（Chromium）。
      # E2E_PREVIEW: 上でビルドした dist/ を vite preview でも出し、オフラインで開けて書体も出ることを確かめる（e2e/offline.spec.ts）
      - name: E2E テスト（PC・Android の Chromium）
        run: npm run test:e2e -- --project=desktop --project=mobile
        env:
          E2E_PREVIEW: '1'
      # iPhone 14（WebKit。iOS の Chrome も Safari も中身は WebKit）。CI の WebKit はソフトウェアの描画でとても重く、
      # 2つを同時に流すと CPU を取り合ってアプリの起動が大きく遅れることがあるので、1つずつ流す（playwright.config.ts の iphone）。
      # Chromium の E2E が落ちても流す。前の段で止まってブラウザを入れていない時は流さない（WebKit が無いという誤りで埋まらないように）。
      # E2E_LAUNCH_RENDERER=page: 起動アニメーションを Worker ではなくページの中で描かせる（テストの中だけ。e2e/helpers.ts）。
      # CI の WebKit（Linux 版）は、Worker で描いた絵を画面に渡す所で時々ページごと落ちる（webkit-diag で 12回ずつ流して、Worker は
      # 24回中 6回落ち、ページの中は 24回とも通った）。作者の iPhone では Worker で描いても問題が無く、Worker の道筋は Chromium の
      # E2E で確かめている（docs/SPEC.md の 2.10）
      - name: E2E テスト（iPhone の WebKit）
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:e2e -- --project=iphone --workers=1
        env:
          E2E_WEBKIT: '1'
          E2E_LAUNCH_RENDERER: page
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/artifacts
          retention-days: 7

  # CI の WebKit で、起動アニメーションの途中にページが落ちる（Target crashed）原因を調べる時だけ流す（コミットの文に [webkit-diag]
  # を入れた時）。起動アニメーションを Worker で描く時（worker）とページの中で描く時（page）で、同じテストを何回も流して落ち方を比べる。
  # アプリの描き方は変えない（page はテストの中だけ。e2e/helpers.ts の collectDiagnosticsOnFailure）。落ちてもほかの確かめは止めない
  webkit-diag:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[webkit-diag]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        renderer: [worker, page]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: 起動アニメーションのテストを 12回ずつ（${{ matrix.renderer }}）
        run: >-
          npx playwright test --project=iphone --workers=1 --retries=0 --repeat-each=12
          -g "強制すると最初に出て|テスト用のログインで空のトップ画面"
        env:
          E2E_WEBKIT: '1'
          E2E_LAUNCH_RENDERER: ${{ matrix.renderer }}
